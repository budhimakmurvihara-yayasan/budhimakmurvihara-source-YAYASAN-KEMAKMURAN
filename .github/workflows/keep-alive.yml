name: Supabase Keep Alive

on:
  schedule:
    # Jalan tiap Senin & Kamis jam 03:00 UTC (~10:00 WIB)
    # Cukup buat jaga-jaga di bawah batas 7 hari nggak aktif dari Supabase
    - cron: '0 3 * * 1,4'
  workflow_dispatch: {}   # supaya bisa dites manual lewat tombol "Run workflow" di tab Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (baca 1 baris kecil dari database)
        run: |
          curl -s -o /dev/null -w "HTTP status: %{http_code}\n" \
            "https://tgpabahjuwdcorltmhll.supabase.co/rest/v1/site_content?select=section&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
