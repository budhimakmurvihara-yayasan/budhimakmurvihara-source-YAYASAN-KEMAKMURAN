<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sekolah Minggu Buddhis — Yayasan Kemakmuran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B1A14; --paper:#F4EFE4; --paper-deep:#EAE0CC;
    --maroon:#5C2323; --maroon-deep:#3E1616;
    --gold:#B3823D; --gold-soft:#D9B77A;
    --line:#CBBB98; --white-soft:#FBF7EE; --danger:#8A2E2E;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; }
  header{ background:var(--maroon-deep); color:var(--white-soft); padding:18px 28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .brand{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:1.2rem; }
  .brand span{ color:var(--gold-soft); font-family:'Inter',sans-serif; font-size:0.65rem; text-transform:uppercase; display:block; letter-spacing:0.1em; margin-top:2px; }
  header .right{ display:flex; align-items:center; gap:18px; font-size:0.82rem; }
  header a{ color:rgba(251,247,238,0.8); text-decoration:none; }
  header a:hover{ color:var(--gold-soft); }
  .role-badge{ background:var(--gold); color:var(--maroon-deep); font-size:0.65rem; text-transform:uppercase; padding:3px 10px; border-radius:10px; font-weight:600; }

  #login-view{ max-width:400px; margin:100px auto; background:var(--white-soft); border:1px solid var(--line); border-radius:6px; padding:40px 32px; }
  #login-view h1{ font-family:'Cormorant Garamond',serif; font-size:1.5rem; margin-bottom:8px; color:var(--maroon-deep); }
  #login-view p.sub{ font-size:0.85rem; color:#7A6D57; margin-bottom:24px; }
  label{ display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:#7A6D57; margin:14px 0 6px; }
  label:first-of-type{ margin-top:0; }
  input, textarea, select{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:4px; font-family:'Inter',sans-serif; font-size:0.9rem; background:#fff; color:var(--ink); }
  textarea{ resize:vertical; min-height:60px; }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--gold); }
  .btn-primary{ width:100%; margin-top:22px; padding:11px; border:none; border-radius:3px; cursor:pointer; background:var(--maroon-deep); color:var(--white-soft); font-size:0.8rem; text-transform:uppercase; font-weight:500; }
  .btn-primary:hover{ background:var(--gold); color:var(--maroon-deep); }
  #error-msg{ color:var(--danger); font-size:0.82rem; margin-top:12px; display:none; }
  .btn-small{ padding:7px 16px; border:1px solid rgba(251,247,238,0.4); border-radius:20px; font-size:0.75rem; cursor:pointer; background:transparent; color:var(--white-soft); }
  .btn-small:hover{ border-color:var(--gold-soft); color:var(--gold-soft); }

  #app-view{ display:none; }
  .wrap{ max-width:1080px; margin:0 auto; padding:32px 24px 80px; }

  .tabs{ display:flex; gap:6px; margin-bottom:26px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tab-btn{ padding:12px 18px; font-size:0.85rem; background:none; border:none; cursor:pointer; color:#7A6D57; border-bottom:2px solid transparent; font-family:'Inter',sans-serif; }
  .tab-btn.active{ color:var(--maroon-deep); border-color:var(--gold); font-weight:600; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }

  .panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
  .panel-head h2{ font-family:'Cormorant Garamond',serif; font-size:1.4rem; color:var(--maroon-deep); }
  .btn{ padding:9px 18px; border-radius:3px; font-size:0.78rem; text-transform:uppercase; cursor:pointer; font-weight:500; border:1px solid var(--maroon-deep); background:var(--maroon-deep); color:var(--white-soft); }
  .btn:hover{ background:var(--gold); border-color:var(--gold); color:var(--maroon-deep); }
  .btn-outline{ background:transparent; color:var(--maroon-deep); }
  .btn-outline:hover{ background:var(--maroon-deep); color:var(--white-soft); }

  .card-list{ display:flex; flex-direction:column; gap:12px; }
  .item-card{ background:var(--white-soft); border:1px solid var(--line); border-radius:6px; padding:18px 20px; }
  .item-card .top-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .item-card .date-badge{ font-size:0.7rem; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:6px; display:block; }
  .item-card h3{ font-family:'Cormorant Garamond',serif; font-size:1.15rem; color:var(--maroon-deep); margin-bottom:6px; }
  .item-card .meta{ font-size:0.82rem; color:#5A4A40; line-height:1.6; }
  .item-card .meta b{ color:var(--maroon-deep); }
  .item-actions{ display:flex; gap:10px; flex-shrink:0; }
  .icon-btn{ background:none; border:none; cursor:pointer; font-size:0.75rem; color:#7A6D57; text-transform:uppercase; }
  .icon-btn:hover{ color:var(--maroon-deep); }
  .icon-btn.danger:hover{ color:var(--danger); }
  .empty-note{ color:#8A7F63; font-style:italic; font-size:0.88rem; padding:20px 0; }

  .tipe-filter{ display:flex; gap:8px; margin-bottom:16px; }
  .stats-row{ display:flex; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  .stat-box{ background:var(--white-soft); border:1px solid var(--line); border-radius:6px; padding:16px 26px; display:flex; flex-direction:column; align-items:center; min-width:100px; }
  .stat-num{ font-family:'Cormorant Garamond',serif; font-size:1.9rem; font-weight:600; color:var(--maroon-deep); line-height:1; }
  .stat-label{ font-size:0.68rem; text-transform:uppercase; color:var(--gold); margin-top:6px; letter-spacing:0.06em; }
  .tipe-filter button{ padding:6px 16px; border-radius:16px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:0.78rem; }
  .tipe-filter button.active{ background:var(--maroon-deep); color:var(--white-soft); border-color:var(--maroon-deep); }

  .history-item{ border-left:2px solid var(--gold); padding-left:18px; margin-bottom:22px; position:relative; }
  .history-item::before{ content:''; position:absolute; left:-6px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--gold); }
  .history-date{ font-size:0.72rem; text-transform:uppercase; color:var(--gold); font-weight:600; }
  .history-filter-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .filter-chip{ padding:7px 16px; border-radius:16px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:0.78rem; font-family:'Inter',sans-serif; color:var(--ink); }
  .filter-chip.active{ background:var(--maroon-deep); color:var(--white-soft); border-color:var(--maroon-deep); }
  .filter-chip:hover:not(.active){ border-color:var(--gold); color:var(--gold); }
  .history-item h3{ font-family:'Cormorant Garamond',serif; font-size:1.1rem; color:var(--maroon-deep); margin:4px 0 6px; }
  .history-item p{ font-size:0.85rem; color:#5A4A40; margin-bottom:4px; }

  #modal-overlay{ display:none; position:fixed; inset:0; background:rgba(43,26,20,0.55); z-index:500; align-items:flex-start; justify-content:center; padding:60px 20px; overflow-y:auto; }
  #modal-overlay.open{ display:flex; }
  #modal-box{ background:var(--paper); border-radius:8px; max-width:560px; width:100%; padding:30px 32px; }
  #modal-box h2{ font-family:'Cormorant Garamond',serif; font-size:1.3rem; color:var(--maroon-deep); margin-bottom:20px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:12px; margin-top:22px; }
  .btn-cancel{ padding:10px 20px; border:1px solid var(--line); border-radius:3px; background:transparent; cursor:pointer; font-size:0.8rem; text-transform:uppercase; }
  .btn-cancel:hover{ border-color:var(--maroon-deep); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }

  @media (max-width:700px){ .row2{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="login-view">
  <h1>Masuk — Program SMB</h1>
  <p class="sub">Gunakan akun admin atau akun pengurus.</p>
  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password">
    <button type="submit" class="btn-primary">Masuk</button>
    <p id="error-msg"></p>
  </form>
</div>

<div id="app-view">
  <header>
    <div class="brand">Sekolah Minggu Buddhis<span>Yayasan Kemakmuran</span></div>
    <div class="right">
      <span id="user-info"></span>
      <a href="index.html">Beranda</a>
      <button class="btn-small" id="logout-btn">Keluar</button>
    </div>
  </header>

  <div class="wrap">
    <div class="tabs">
      <button class="tab-btn active" data-tab="pengumuman">Pengumuman</button>
      <button class="tab-btn" data-tab="jadwal">Jadwal Kegiatan</button>
      <button class="tab-btn" data-tab="laporan">Laporan Kegiatan</button>
      <button class="tab-btn" data-tab="orang">Data Murid & Pengurus</button>
      <button class="tab-btn" data-tab="history">History Kegiatan</button>
    </div>

    <!-- PENGUMUMAN -->
    <div class="tab-panel active" id="panel-pengumuman">
      <div class="panel-head">
        <h2>Pengumuman</h2>
        <button class="btn" id="btn-tambah-pengumuman" style="display:none;" onclick="openAnnouncementModal()">+ Tambah Pengumuman</button>
      </div>
      <div class="card-list" id="announcement-list"></div>
    </div>

    <!-- JADWAL -->
    <div class="tab-panel" id="panel-jadwal">
      <div class="panel-head">
        <h2>Jadwal Kegiatan</h2>
        <button class="btn" id="btn-atur-grup-wa" style="display:none; background:transparent; color:var(--maroon-deep); margin-right:8px;" onclick="openGroupWaSettingModal()">⚙️ Atur Link Grup WA</button>
        <button class="btn" onclick="openScheduleModal()">+ Tambah Jadwal</button>
      </div>
      <div class="card-list" id="schedule-list"></div>
    </div>

    <!-- LAPORAN -->
    <div class="tab-panel" id="panel-laporan">
      <div class="panel-head">
        <h2>Laporan Kegiatan</h2>
        <button class="btn" onclick="openReportModal()">+ Tambah Laporan</button>
      </div>
      <div class="card-list" id="report-list"></div>
    </div>

    <!-- ORANG -->
    <div class="tab-panel" id="panel-orang">
      <div class="panel-head">
        <h2>Data Murid, Pengurus & FDY</h2>
        <button class="btn" onclick="openPersonModal()">+ Tambah Data</button>
      </div>
      <div class="tipe-filter">
        <button class="active" data-tipe="semua" onclick="filterPeople('semua', this)">Semua</button>
        <button data-tipe="murid" onclick="filterPeople('murid', this)">Murid</button>
        <button data-tipe="pengurus" onclick="filterPeople('pengurus', this)">Pengurus</button>
        <button data-tipe="fdy" onclick="filterPeople('fdy', this)">FDY</button>
      </div>
      <div class="card-list" id="people-list"></div>
    </div>

    <!-- HISTORY -->
    <div class="tab-panel" id="panel-history">
      <div class="panel-head">
        <h2>History Kegiatan</h2>
      </div>
      <p style="font-size:0.85rem; color:#7A6D57; margin-bottom:20px;">Gabungan otomatis dari Jadwal & Laporan, diurutkan dari yang terbaru.</p>
      <div id="history-list"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div id="modal-box">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Batal</button>
      <button class="btn" id="modal-save-btn">Simpan</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://tgpabahjuwdcorltmhll.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRncGFiYWhqdXdkY29ybHRtaGxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMjQ5MDYsImV4cCI6MjEwMDkwMDkwNn0.woeNJzLhtIsCiArlAZVK6fRRwmEhpJMls20eyfNHJsc';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let scheduleData = [];
  let reportData = [];
  let peopleData = [];
  let announcementData = [];
  let currentPeopleFilter = 'semua';
  let currentRole = null;
  let groupWaLinkPengurus = '';
  let groupWaLinkMurid = '';

  // ---------- Auth ----------
  async function checkSession(){
    const { data:{ session } } = await sb.auth.getSession();
    if (session) await showApp(session.user);
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorMsg = document.getElementById('error-msg');
    errorMsg.style.display = 'none';
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error){
      errorMsg.textContent = 'Login gagal: ' + error.message;
      errorMsg.style.display = 'block';
      return;
    }
    await showApp(data.user);
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await sb.auth.signOut();
    location.reload();
  });

  async function showApp(user){
    document.getElementById('login-view').style.display = 'none';
    document.getElementById('app-view').style.display = 'block';

    let roleLabel = '';
    const { data: profile } = await sb.from('profiles').select('role').eq('id', user.id).maybeSingle();
    currentRole = profile ? profile.role : null;
    if (currentRole === 'admin') roleLabel = '<span class="role-badge">Admin</span>';
    else if (currentRole === 'user') roleLabel = '<span class="role-badge">Pengurus</span>';

    document.getElementById('user-info').innerHTML = `${user.email} ${roleLabel}`;
    document.getElementById('btn-tambah-pengumuman').style.display = currentRole === 'admin' ? 'inline-block' : 'none';
    document.getElementById('btn-atur-grup-wa').style.display = currentRole === 'admin' ? 'inline-block' : 'none';

    await loadGroupWaLink();
    await loadPeople();
    await loadSchedule();
    await Promise.all([loadAnnouncements(), loadReports()]);
    renderHistory();
  }

  // =====================================================
  // PENGATURAN: Link Grup WhatsApp
  // =====================================================
  async function loadGroupWaLink(){
    const { data, error } = await sb.from('smb_settings').select('key, value').in('key', ['wa_group_link_pengurus', 'wa_group_link_murid']);
    if (error){ console.error(error); return; }
    const byKey = {};
    (data || []).forEach(row => byKey[row.key] = row.value);
    groupWaLinkPengurus = byKey.wa_group_link_pengurus || '';
    groupWaLinkMurid = byKey.wa_group_link_murid || '';
  }

  function openGroupWaSettingModal(){
    document.getElementById('modal-title').textContent = 'Atur Link Grup WhatsApp';
    document.getElementById('modal-body').innerHTML = `
      <label>Link Grup WhatsApp Pengurus</label>
      <input id="grup-wa-link-pengurus" placeholder="https://chat.whatsapp.com/xxxxxxxx" value="${escapeHtml(groupWaLinkPengurus)}">
      <p style="font-size:0.72rem; color:#8A7F63; margin-top:6px; font-style:italic;">Buat info internal & pembagian tugas antar pengurus.</p>

      <label style="margin-top:20px;">Link Grup WhatsApp Murid & Orang Tua</label>
      <input id="grup-wa-link-murid" placeholder="https://chat.whatsapp.com/xxxxxxxx" value="${escapeHtml(groupWaLinkMurid)}">
      <p style="font-size:0.72rem; color:#8A7F63; margin-top:6px; font-style:italic;">Buat pemberitahuan jadwal kelas ke murid & orang tua.</p>

      <p style="font-size:0.75rem; color:#8A7F63; margin-top:16px; font-style:italic; border-top:1px dashed var(--line); padding-top:12px;">
        Buka grup WA di HP → Info Grup → Bagikan Link Grup → salin link-nya ke sini.<br>
        Karena WhatsApp tidak mengizinkan pesan otomatis terisi langsung ke grup, tombolnya nanti akan menyalin teks ke clipboard lalu membuka grup yang sesuai — tinggal tempel (Ctrl+V / tahan lalu Tempel) dan kirim.
      </p>
    `;
    document.getElementById('modal-save-btn').onclick = saveGroupWaLink;
    document.getElementById('modal-overlay').classList.add('open');
  }

  async function saveGroupWaLink(){
    const pengurusVal = document.getElementById('grup-wa-link-pengurus').value.trim();
    const muridVal = document.getElementById('grup-wa-link-murid').value.trim();
    const { error } = await sb.from('smb_settings').upsert([
      { key: 'wa_group_link_pengurus', value: pengurusVal },
      { key: 'wa_group_link_murid', value: muridVal },
    ], { onConflict: 'key' });
    if (error){ alert('Gagal menyimpan: ' + error.message); return; }
    groupWaLinkPengurus = pengurusVal;
    groupWaLinkMurid = muridVal;
    closeModal();
    renderScheduleList();
    renderAnnouncementList();
  }

  // ---------- Tabs ----------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str||''; return d.innerHTML; }
  function fmtDate(dateStr){
    if (!dateStr) return '-';
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
  }

  // =====================================================
  // PENGUMUMAN
  // =====================================================
  async function loadAnnouncements(){
    const { data, error } = await sb.from('announcements').select('*').order('created_at', { ascending:false });
    if (error){ console.error(error); return; }
    announcementData = data || [];
    renderAnnouncementList();
  }

  function renderAnnouncementList(){
    const container = document.getElementById('announcement-list');
    if (!announcementData.length){
      container.innerHTML = '<p class="empty-note">Belum ada pengumuman.</p>';
      return;
    }
    const isAdmin = currentRole === 'admin';
    container.innerHTML = announcementData.map(item => `
      <div class="item-card">
        <div class="top-row">
          <div>
            <span class="date-badge">${fmtDate(item.created_at ? item.created_at.slice(0,10) : '')}</span>
            <h3>${escapeHtml(item.judul)}</h3>
            <div class="meta" style="white-space:pre-line;">${escapeHtml(item.isi)}</div>
            <div style="margin-top:10px; display:flex; flex-wrap:wrap; gap:16px;">
              <a href="#" onclick="copyAndOpenGroup(${JSON.stringify(`*${item.judul}*\n\n${item.isi}`).replace(/"/g, '&quot;')}, groupWaLinkPengurus); return false;" style="display:inline-flex; align-items:center; gap:5px; font-size:0.78rem; color:#3DA855; font-weight:500; text-decoration:none;">
                👥 Kirim ke Grup Pengurus
              </a>
              <a href="#" onclick="copyAndOpenGroup(${JSON.stringify(`*${item.judul}*\n\n${item.isi}`).replace(/"/g, '&quot;')}, groupWaLinkMurid); return false;" style="display:inline-flex; align-items:center; gap:5px; font-size:0.78rem; color:#3DA855; font-weight:500; text-decoration:none;">
                👨‍👩‍👧 Kirim ke Grup Murid/Ortu
              </a>
            </div>
          </div>
          ${isAdmin ? `
          <div class="item-actions">
            <button class="icon-btn" onclick="openAnnouncementModal(${item.id})">Edit</button>
            <button class="icon-btn danger" onclick="deleteAnnouncement(${item.id})">Hapus</button>
          </div>` : ''}
        </div>
      </div>
    `).join('');
  }

  function openAnnouncementModal(id){
    const item = id ? announcementData.find(a => a.id === id) : null;
    document.getElementById('modal-title').textContent = id ? 'Edit Pengumuman' : 'Tambah Pengumuman';
    document.getElementById('modal-body').innerHTML = `
      <label>Judul</label>
      <input id="ann-judul" value="${escapeHtml(item ? item.judul : '')}">
      <label>Isi Pengumuman</label>
      <textarea id="ann-isi" style="min-height:120px;">${escapeHtml(item ? item.isi : '')}</textarea>
    `;
    document.getElementById('modal-save-btn').onclick = () => saveAnnouncement(id);
    document.getElementById('modal-overlay').classList.add('open');
  }

  async function saveAnnouncement(id){
    const payload = {
      judul: document.getElementById('ann-judul').value,
      isi: document.getElementById('ann-isi').value,
    };
    if (!payload.judul || !payload.isi){ alert('Judul dan isi wajib diisi.'); return; }

    let error;
    if (id){
      ({ error } = await sb.from('announcements').update({ ...payload, updated_at: new Date().toISOString() }).eq('id', id));
    } else {
      ({ error } = await sb.from('announcements').insert(payload));
    }
    if (error){ alert('Gagal menyimpan: ' + error.message); return; }
    closeModal();
    await loadAnnouncements();
  }

  async function deleteAnnouncement(id){
    if (!confirm('Hapus pengumuman ini?')) return;
    const { error } = await sb.from('announcements').delete().eq('id', id);
    if (error){ alert('Gagal menghapus: ' + error.message); return; }
    await loadAnnouncements();
  }

  // =====================================================
  // JADWAL KEGIATAN
  // =====================================================
  async function loadSchedule(){
    const { data, error } = await sb.from('smb_schedule').select('*').order('tanggal', { ascending:false });
    if (error){ console.error(error); return; }
    scheduleData = data || [];
    renderScheduleList();
  }

  function personName(id){
    if (!id) return '-';
    const p = peopleData.find(p => p.id === id);
    return p ? p.nama : '-';
  }

  function personNames(ids){
    if (!ids || !ids.length) return '-';
    return ids.map(id => personName(id)).join(', ');
  }

  function checkboxOptions(name, selectedIds){
    const pengurusList = peopleData.filter(p => p.tipe === 'pengurus');
    if (!pengurusList.length) return '<p style="font-size:0.82rem; color:#8A7F63;">Belum ada data pengurus.</p>';
    const sel = selectedIds || [];
    return `<div style="border:1px solid var(--line); border-radius:4px; padding:10px 12px; max-height:160px; overflow-y:auto; background:#fff;">
      ${pengurusList.map(p => `
        <label style="display:flex; align-items:center; gap:8px; font-size:0.88rem; text-transform:none; letter-spacing:0; color:var(--ink); margin:6px 0; font-weight:400;">
          <input type="checkbox" name="${name}" value="${p.id}" ${sel.includes(p.id) ? 'checked' : ''} style="width:auto;">
          ${escapeHtml(p.nama)}${p.email ? '' : ' (belum ada email)'}
        </label>
      `).join('')}
    </div>`;
  }

  function pengurusOptions(selectedId){
    const pengurusList = peopleData.filter(p => p.tipe === 'pengurus');
    let opts = `<option value="">— Belum ditentukan —</option>`;
    opts += pengurusList.map(p => `<option value="${p.id}" ${selectedId==p.id?'selected':''}>${escapeHtml(p.nama)}${p.email ? '' : ' (belum ada email)'}</option>`).join('');

  function personObj(id){

  function formatPhoneWA(phone){
    if (!phone) return '';
    let p = phone.replace(/[^0-9]/g, '');
    if (p.startsWith('0')) p = '62' + p.slice(1);
    else if (!p.startsWith('62')) p = '62' + p;
    return p;
  }

    return [

  function buildWaLink(phone, message){
    const num = formatPhoneWA(phone);
    const text = encodeURIComponent(message);
    return num ? `https://wa.me/${num}?text=${text}` : `https://wa.me/?text=${text}`;
  }

  async function copyAndOpenGroup(text, targetLink){
    if (!targetLink){
      alert('Link grup WA ini belum diatur. Klik "⚙️ Atur Link Grup WA" dulu (khusus admin).');
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      alert('Teks sudah disalin! Setelah grup terbuka, tempel (Ctrl+V) lalu kirim.');
    } catch(e){
      alert('Gagal menyalin otomatis, silakan salin teks ini secara manual:\n\n' + text);
    }
    window.open(targetLink, '_blank');
  }

  async function saveSchedule(id){
    const payload = {
      tanggal: document.getElementById('sch-tanggal').value,
      jam_mulai: document.getElementById('sch-jam-mulai').value || null,
      tema_materi: document.getElementById('sch-tema').value,
      aktivitas_tambahan: document.getElementById('sch-aktivitas').value,
      pemateri_id: document.getElementById('sch-pemateri').value || null,
      mc_id: document.getElementById('sch-mc').value || null,
      buah_ids: Array.from(document.querySelectorAll('input[name="sch-buah"]:checked')).map(el => parseInt(el.value)),
    };
    if (!payload.tanggal){ alert('Tanggal wajib diisi.'); return; }

    // Kalau jadwal diubah, reset status reminder biar terkirim ulang sesuai jadwal baru
    if (id) payload.reminder_3d_sent = false, payload.reminder_1d_sent = false, payload.reminder_1h_sent = false;

    let error;
    if (id){
      ({ error } = await sb.from('smb_schedule').update(payload).eq('id', id));
    } else {
      ({ error } = await sb.from('smb_schedule').insert(payload));
    }
    if (error){ alert('Gagal menyimpan: ' + error.message); return; }
    closeModal();
    await loadSchedule();
    renderHistory();
  }

  // =====================================================
  // HISTORY (gabungan otomatis jadwal + laporan)
  // =====================================================
  const MONTH_NAMES = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  let selectedHistoryYear = null;
  let selectedHistoryMonth = null;

  function selectHistoryYear(y){
    selectedHistoryYear = y;
    selectedHistoryMonth = null;
    renderHistory();
  }
  function selectHistoryMonth(m){
    selectedHistoryMonth = m;
    renderHistory();
  }

  function renderHistory(){
    const combined = {};
    scheduleData.forEach(s => {
      combined[s.tanggal] = combined[s.tanggal] || {};
      combined[s.tanggal].jadwal = s;
    });
    reportData.forEach(r => {
      combined[r.tanggal] = combined[r.tanggal] || {};
      combined[r.tanggal].laporan = r;
    });

    const allDates = Object.keys(combined);
    const container = document.getElementById('history-list');
    if (!allDates.length){ container.innerHTML = '<p class="empty-note">Belum ada history. Isi Jadwal atau Laporan terlebih dahulu.</p>'; return; }

    const years = [...new Set(allDates.map(d => d.slice(0,4)))].sort((a,b) => b.localeCompare(a));
    if (!selectedHistoryYear || !years.includes(selectedHistoryYear)) selectedHistoryYear = years[0];

    const monthsInYear = [...new Set(allDates.filter(d => d.startsWith(selectedHistoryYear)).map(d => parseInt(d.slice(5,7))))].sort((a,b) => a - b);

    let html = `<div class="history-filter-row">` +
      years.map(y => `<button class="filter-chip ${y === selectedHistoryYear ? 'active' : ''}" onclick="selectHistoryYear('${y}')">${y}</button>`).join('') +
      `</div>`;

    html += `<div class="history-filter-row">` +
      `<button class="filter-chip ${selectedHistoryMonth === null ? 'active' : ''}" onclick="selectHistoryMonth(null)">Semua Bulan</button>` +
      monthsInYear.map(m => `<button class="filter-chip ${selectedHistoryMonth === m ? 'active' : ''}" onclick="selectHistoryMonth(${m})">${MONTH_NAMES[m-1]}</button>`).join('') +
      `</div>`;

    const filteredDates = allDates.filter(d => {
      if (!d.startsWith(selectedHistoryYear)) return false;
      if (selectedHistoryMonth && parseInt(d.slice(5,7)) !== selectedHistoryMonth) return false;
      return true;
    }).sort((a,b) => new Date(b) - new Date(a));

    if (!filteredDates.length){
      html += '<p class="empty-note">Tidak ada kegiatan pada periode ini.</p>';
      container.innerHTML = html;
      return;
    }

    html += filteredDates.map(date => {
      const entry = combined[date];
      const j = entry.jadwal;
      const r = entry.laporan;
      return `
        <div class="history-item">
          <span class="history-date">${fmtDate(date)}</span>
          <h3>${j ? escapeHtml(j.tema_materi || '(Tanpa tema)') : '(Tidak ada jadwal tercatat)'}</h3>
          ${j ? `<p><b>Pemateri:</b> ${escapeHtml(personName(j.pemateri_id))} &nbsp;|&nbsp; <b>MC:</b> ${escapeHtml(personName(j.mc_id))} &nbsp;|&nbsp; <b>Persembahan Buah:</b> ${escapeHtml(personNames(j.buah_ids))}</p>` : ''}
          ${r ? `<p><b>Kehadiran:</b> ${r.kehadiran_pengurus ?? 0} pengurus, ${r.kehadiran_murid ?? 0} murid</p>` : ''}
          ${r && r.catatan ? `<p><b>Catatan:</b> ${escapeHtml(r.catatan)}</p>` : ''}
        </div>
      `;
    }).join('');

    container.innerHTML = html;
  }

  function closeModal(){
    document.getElementById('modal-overlay').classList.remove('open');
  }
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'modal-overlay') closeModal();
  });

  checkSession();
</script>

</body>
</html>
